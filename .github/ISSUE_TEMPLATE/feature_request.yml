name: Feature or extension idea
description: A new feature, or an extension you would like to build.
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What it does
      description: The problem it solves, in a sentence or two.
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where it shows
      description: A Home card, a tab, the pill, the game bar, settings only? Space is limited, so this matters.
  - type: checkboxes
    id: build
    attributes:
      label: Building it
      options:
        - label: I would like to build this myself (see CONTRIBUTING.md)
