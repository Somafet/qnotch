name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform or area
      options:
        - Windows
        - macOS port development (no release yet)
        - Website
        - Repository / CI / releases
        - Shared / more than one
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Screenshots help.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: QNotch version
      description: The release you downloaded, or the commit you built.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and version
      description: For website issues, also include your browser and version.
      placeholder: Windows 11 24H2, or macOS version and browser
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - x64 / Intel
        - arm64 / Apple silicon
        - Other / unknown / not applicable
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: >-
        Windows: relevant lines from %APPDATA%\QNotch\logs\qnotch.log or crash.log.
        For the website or tooling, include build or console output. For Mac development,
        use the implementation's documented log location. Remove personal information,
        tokens, and signing/account details.
      render: text
