name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build src/QNotch/QNotch.csproj -c Release -warnaserror

      - name: Updater checks
        run: dotnet run --project tests/QNotch.UpdateTests -c Release

      - name: Phone sharing checks
        run: dotnet run --project tests/QNotch.PhoneShareTests -c Release

      # Renders every tab and settings page off-screen in a clean data folder. Fails if a page throws or it hangs.
      - name: Snapshot smoke test
        shell: pwsh
        env:
          QNOTCH_DATA_DIR: ${{ runner.temp }}\qnotch-data
          DOTNET_DISABLE_GUI_ERRORS: '1'
        run: |
          New-Item -ItemType Directory -Force $env:QNOTCH_DATA_DIR | Out-Null
          $exe = "src/QNotch/bin/Release/net10.0-windows10.0.22621.0/win-x64/QNotch.exe"
          $p = Start-Process $exe -ArgumentList '--snapshot', "$PWD\snapshots" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "Snapshot timed out" }
          if ($p.ExitCode -ne 0) { throw "Snapshot exited with code $($p.ExitCode)" }
          $report = Get-Content snapshots/snapshot.txt
          $report
          if ($report[-1] -ne 'done') { throw "Snapshot failed" }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshots
          path: snapshots
          if-no-files-found: ignore

  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Lint GitHub Actions workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  website:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build

  # Branch protection already requires "build". Never rename it or skip it on failure.
  build:
    name: build
    if: always()
    needs: [windows, repository, website]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation job to succeed
        env:
          WINDOWS_RESULT: ${{ needs.windows.result }}
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          WEBSITE_RESULT: ${{ needs.website.result }}
        run: |
          test "$WINDOWS_RESULT" = success
          test "$REPOSITORY_RESULT" = success
          test "$WEBSITE_RESULT" = success
