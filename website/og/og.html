<script>
  // Deterministic random so every render looks the same
  let seed = 11;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

  const speed = document.getElementById('speed');
  for (const [x, h, o] of [[390, 250, .35], [406, 170, .6], [422, 300, .25], [778, 280, .3], [794, 190, .6], [810, 240, .35], [370, 120, .2], [830, 130, .2]]) {

    speed.appendChild(s);
  }

  // Ink chips thrown out of the impact point
  const shards = document.getElementById('shards');
  const colors = ['#0c0c0f', '#0c0c0f', '#0c0c0f', '#4f4f59', '#2f6fe4'];
  for (let k = 0; k < 26; k++) {
    const side = k % 2 ? 1 : -1;
    const ang = (rnd() * 70 - 50) * Math.PI / 180;
    const dist = 60 + rnd() * 230;
    const x = 600 + side * (172 + Math.cos(ang) * dist * 0.6);
    const y = 404 + Math.sin(ang) * dist * 0.55;
    const w = 5 + rnd() * 15, h = 4 + rnd() * 11;
    const p = () => Math.round(rnd() * 100) + '%';
    const el = document.createElement('i');
    el.className = 'shard';
    Object.assign(el.style, {
      left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px',
      background: colors[Math.floor(rnd() * colors.length)],
      opacity: (0.45 + rnd() * 0.55).toFixed(2),
      clipPath: `polygon(${p()} 0, 100% ${p()}, ${p()} 100%, 0 ${p()})`,
      transform: `rotate(${Math.round(rnd() * 360)}deg)`,
    });
    shards.appendChild(el);
  }
